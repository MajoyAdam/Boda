<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>María & Adam · 24 abril 2027</title>
<meta name="description" content="Toda la información de la boda de María y Adam: cómo llegar, dónde dormir, qué ponerte y confirmar tu asistencia.">
<meta name="theme-color" content="#82A07C">
<link rel="icon" href="favicon.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<meta property="og:type" content="website">
<meta property="og:title" content="María & Adam · 24 abril 2027">
<meta property="og:description" content="Domaine Sainte-Raphine, Burdeos. Confirma tu asistencia aquí.">
<meta property="og:image" content="og.jpg">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Outfit:wght@300;400;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

<style>
  :root{
    --verde:#82A07C; --crema:#F7F2E6; --tinta:#2E2A16; --naranja:#FF4C25;
    --linea:rgba(46,42,22,.16);
    --display:"Baloo 2","Trebuchet MS",cursive;
    --texto:"Outfit","Segoe UI",system-ui,sans-serif;
    --util:"Space Mono",ui-monospace,monospace;
  }
  *{box-sizing:border-box}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
  body{margin:0;background:var(--verde);color:var(--tinta);font-family:var(--texto);font-weight:300;font-size:16px;line-height:1.55;position:relative;overflow-x:hidden;min-height:100vh}
  .jardin{position:fixed;inset:0;pointer-events:none;z-index:0}
  .jardin img{position:absolute;opacity:.8;filter:drop-shadow(0 3px 5px rgba(46,42,22,.18))}
  .wrap{max-width:560px;margin:0 auto;padding:0 20px 80px;position:relative;z-index:1}

  .nav{position:sticky;top:0;z-index:20;background:rgba(130,160,124,.95);backdrop-filter:blur(8px)}
  .nav-top{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:8px;padding:9px 20px 2px}
  .logo{font-family:var(--display);font-weight:800;font-size:17px;color:var(--crema);background:none;border:none;cursor:pointer;padding:0}
  .idioma{margin-left:auto;display:flex;gap:2px;background:var(--crema);border-radius:999px;padding:3px}
  .idioma button{border:none;background:none;font-size:14px;line-height:1;padding:5px 7px;border-radius:999px;cursor:pointer;opacity:.4;font-family:var(--util)}
  .idioma button[aria-pressed="true"]{opacity:1;background:var(--verde)}
  .menu{max-width:560px;margin:0 auto;display:flex;gap:7px;overflow-x:auto;padding:9px 20px;scrollbar-width:none}
  .menu::-webkit-scrollbar{display:none}
  .menu button{flex:0 0 auto;font-family:var(--util);font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--tinta);border:none;border-radius:999px;padding:7px 13px;background:var(--crema);cursor:pointer;opacity:.75}
  .menu button[aria-current="page"]{background:var(--naranja);color:var(--crema);opacity:1}
  a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--naranja);outline-offset:2px}

  .pagina{display:none;padding-top:28px}
  .pagina.activa{display:block;animation:entra .28s ease}
  @keyframes entra{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .tit{background:var(--crema);border-radius:16px;padding:13px 18px 14px;display:inline-block;margin:0 0 16px;box-shadow:0 4px 10px rgba(46,42,22,.14)}
  .tit h2{font-family:var(--display);font-weight:800;font-size:29px;line-height:1;margin:0;color:var(--naranja)}
  .tit p{font-family:var(--util);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;margin:5px 0 0;opacity:.55}

  .card{background:var(--crema);border-radius:18px;padding:18px;margin-bottom:12px;box-shadow:0 5px 14px rgba(46,42,22,.14)}
  .card h3{margin:0 0 4px;font-family:var(--display);font-weight:600;font-size:19px}
  .card p{margin:0;font-size:14.5px;opacity:.85}
  .etiqueta{font-family:var(--util);font-size:10px;letter-spacing:.1em;text-transform:uppercase;opacity:.5;margin-bottom:6px}
  .enlace{display:inline-block;margin-top:10px;font-family:var(--util);font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--naranja);text-decoration:none;border-bottom:1.5px solid var(--naranja);padding-bottom:2px}
  .intro{color:var(--crema);font-size:14.5px;margin:0 0 14px}

  .portada{width:100%;border-radius:10px;display:block;box-shadow:0 8px 26px rgba(46,42,22,.24)}
  .eyebrow{font-family:var(--util);font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--crema);margin:22px 0 0;text-align:center}
  .fecha{font-family:var(--display);font-weight:600;font-size:22px;color:var(--crema);margin:6px 0 0;text-align:center;line-height:1.3;white-space:pre-line}
  .cuenta{display:flex;justify-content:center;gap:10px;margin-top:22px}
  .cuenta div{background:var(--crema);border-radius:14px;padding:11px 4px;width:74px;box-shadow:0 4px 10px rgba(46,42,22,.16)}
  .cuenta b{display:block;font-family:var(--display);font-weight:800;font-size:27px;line-height:1;color:var(--naranja)}
  .cuenta span{font-family:var(--util);font-size:9px;letter-spacing:.08em;text-transform:uppercase;opacity:.6}
  .acciones{display:flex;gap:9px;margin-top:24px}
  .acciones button{flex:1;font-family:var(--display);font-weight:600;font-size:15px;padding:13px 8px;border-radius:14px;border:none;background:var(--crema);color:var(--tinta);cursor:pointer;box-shadow:0 4px 0 rgba(46,42,22,.22)}
  .acciones button:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(46,42,22,.22)}

  .hora{display:flex;gap:14px;padding:12px 0;border-bottom:1px dashed var(--linea)}
  .hora:last-child{border:none}
  .hora time{font-family:var(--util);font-weight:700;font-size:13px;flex:0 0 52px;color:var(--naranja)}
  .hora strong{display:block;font-weight:600;font-size:15px}
  .hora em{font-style:normal;font-size:13.5px;opacity:.7}

  .paleta{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin:14px 0 4px}
  .paleta span{aspect-ratio:1;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(46,42,22,.12)}
  .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
  .tag{font-family:var(--util);font-size:11px;padding:5px 10px;border-radius:999px;border:1px solid var(--linea)}
  .si{background:rgba(130,160,124,.28)} .no{background:rgba(255,76,37,.14)}

  label{display:block;font-family:var(--util);font-size:11px;letter-spacing:.08em;text-transform:uppercase;opacity:.6;margin:14px 0 5px}
  input,select,textarea{width:100%;font-family:var(--texto);font-size:16px;padding:11px 13px;border:1px solid var(--linea);border-radius:12px;background:#fff;color:var(--tinta)}
  textarea{min-height:76px;resize:vertical}
  .fila{display:flex;gap:10px}.fila>*{flex:1}
  .opciones{display:flex;gap:8px;margin-top:5px}
  .opciones button{flex:1;font-family:var(--texto);font-size:14px;padding:11px;border-radius:12px;border:1px solid var(--linea);background:#fff;color:var(--tinta);cursor:pointer}
  .opciones button[aria-pressed="true"]{background:var(--tinta);color:var(--crema);border-color:var(--tinta)}
  .enviar{width:100%;margin-top:20px;font-family:var(--display);font-weight:800;font-size:20px;padding:14px;border:none;border-radius:14px;background:var(--naranja);color:var(--crema);cursor:pointer;box-shadow:0 5px 0 #C8371A}
  .enviar:active{transform:translateY(3px);box-shadow:0 2px 0 #C8371A}
  .aviso{font-family:var(--util);font-size:11px;margin-top:12px;opacity:.55;text-align:center}
  .aviso.claro{color:var(--crema);opacity:.85}
  .check{display:flex;align-items:center;gap:9px;margin-top:14px;font-size:14px}
  .check input{width:auto}
  .ticket{position:relative;background:var(--crema);border-radius:18px;padding:20px;box-shadow:0 5px 14px rgba(46,42,22,.16)}
  .ticket::before,.ticket::after{content:"";position:absolute;width:22px;height:22px;background:var(--verde);border-radius:50%;top:calc(50% - 11px)}
  .ticket::before{left:-11px}.ticket::after{right:-11px}

  .album{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .album img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:8px;background:var(--crema);padding:6px;box-shadow:0 5px 12px rgba(46,42,22,.2);cursor:pointer;display:block}
  .album img:nth-child(4n){transform:rotate(1.4deg)}
  .album img:nth-child(4n+3){transform:rotate(-1.6deg)}
  .lupa{position:fixed;inset:0;background:rgba(46,42,22,.93);z-index:50;display:none;align-items:center;justify-content:center;padding:20px}
  .lupa.abierta{display:flex}
  .lupa img{max-width:100%;max-height:86vh;border-radius:8px;background:var(--crema);padding:8px}
  .lupa button{position:absolute;top:18px;right:18px;background:var(--crema);border:none;border-radius:999px;width:40px;height:40px;font-size:18px;cursor:pointer}

  .corcho{background:url("img/corcho.jpg") repeat;background-size:300px;border-radius:14px;padding:18px 14px 24px;box-shadow:inset 0 0 40px rgba(46,42,22,.35),0 6px 16px rgba(46,42,22,.25);border:9px solid #A9793F}
  .notas{display:flex;flex-wrap:wrap;gap:14px}
  .nota{position:relative;flex:1 1 44%;min-width:142px;padding:18px 13px 13px;border-radius:3px;font-size:14px;box-shadow:2px 4px 9px rgba(46,42,22,.32);line-height:1.4}
  .nota:nth-child(4n){transform:rotate(-2deg)}
  .nota:nth-child(4n+1){transform:rotate(1.6deg)}
  .nota:nth-child(4n+2){transform:rotate(-.8deg)}
  .nota:nth-child(4n+3){transform:rotate(2.2deg)}
  .nota::before{content:"";position:absolute;top:-6px;left:50%;transform:translateX(-50%);width:13px;height:13px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#FF7A5C,#C8371A);box-shadow:0 2px 3px rgba(46,42,22,.5)}
  .nota p{margin:0 0 8px;font-style:italic}
  .nota b{font-family:var(--util);font-size:10px;letter-spacing:.06em;text-transform:uppercase;opacity:.65;font-weight:400}
  .vacio{color:var(--crema);font-family:var(--util);font-size:12px;text-align:center;padding:26px 10px;width:100%;text-shadow:0 1px 3px rgba(46,42,22,.6)}

  .cancion{display:flex;gap:10px;align-items:baseline;padding:9px 0;border-bottom:1px dashed var(--linea)}
  .cancion:last-child{border:none}
  .cancion span{font-family:var(--util);font-size:11px;opacity:.45;flex:0 0 24px}
  .cancion strong{font-weight:600;font-size:15px}
  .cancion em{font-style:normal;opacity:.6;font-size:13.5px}
  .spot{width:100%;height:352px;border:none;border-radius:14px;margin-bottom:12px;background:var(--crema)}
  .rollo{margin:16px -20px;padding:16px 0;background:var(--tinta);border-top:14px solid transparent;border-bottom:14px solid transparent;background-clip:padding-box;position:relative;overflow-x:auto;scrollbar-width:none}
  .rollo::-webkit-scrollbar{display:none}
  .rollo::before,.rollo::after{content:"";position:absolute;left:0;right:0;height:14px;background-image:repeating-linear-gradient(90deg,var(--verde) 0 9px,transparent 9px 20px)}
  .rollo::before{top:-14px}.rollo::after{bottom:-14px}
  .frames{display:flex;gap:8px;padding:0 20px;min-width:min-content}
  .frame{flex:0 0 62px;height:62px;border-radius:6px;border:1px solid rgba(247,242,230,.25);display:flex;align-items:center;justify-content:center;font-family:var(--util);font-size:11px;color:rgba(247,242,230,.5);cursor:pointer}
  .frame.usado{background:var(--naranja);color:var(--crema);border-color:var(--naranja)}
  .btn-grande{display:block;text-align:center;text-decoration:none;margin-top:14px;font-family:var(--display);font-weight:800;font-size:19px;padding:14px;border-radius:14px;background:var(--naranja);color:var(--crema);box-shadow:0 5px 0 #C8371A}

  details{background:var(--crema);border-radius:14px;padding:14px 16px;margin-bottom:8px}
  summary{cursor:pointer;font-weight:600;font-size:15px;list-style:none}
  summary::-webkit-details-marker{display:none}
  summary::after{content:"+";float:right;font-family:var(--util);color:var(--naranja)}
  details[open] summary::after{content:"–"}
  details p{margin:10px 0 0;font-size:14.5px;opacity:.8}

  .panel{background:var(--tinta);color:var(--crema);border-radius:18px;padding:20px;margin-top:24px}
  .panel .tit{background:rgba(247,242,230,.12);box-shadow:none}
  .panel .tit h2{color:var(--crema);font-size:24px}
  .panel .tit p{color:rgba(247,242,230,.6);opacity:1}
  .panel input{background:rgba(247,242,230,.1);border-color:rgba(247,242,230,.25);color:var(--crema)}
  .panel label{color:rgba(247,242,230,.6)}
  .cifras{display:flex;gap:8px;margin:16px 0}
  .cifras div{flex:1;background:rgba(247,242,230,.08);border-radius:12px;padding:12px 8px;text-align:center}
  .cifras b{display:block;font-family:var(--display);font-weight:800;font-size:24px}
  .cifras span{font-family:var(--util);font-size:9px;letter-spacing:.06em;text-transform:uppercase;opacity:.6}
  .invitado{border-bottom:1px solid rgba(247,242,230,.14);padding:10px 0;font-size:14px}
  .invitado em{font-style:normal;display:block;font-size:12.5px;opacity:.65}
  .privado{font-family:var(--util);font-size:10px;color:var(--naranja);letter-spacing:.06em;text-transform:uppercase}

  footer{text-align:center;margin-top:40px;font-family:var(--util);font-size:11px;color:var(--crema);opacity:.75}
  footer button{background:none;border:none;font-family:var(--util);font-size:11px;color:var(--crema);opacity:.9;cursor:pointer;text-decoration:underline;margin-top:8px}
</style>
</head>
<body>

<nav class="nav">
  <div class="nav-top">
    <button class="logo" id="logo">María &amp; Adam</button>
    <div class="idioma">
      <button data-lang="es" aria-pressed="true">🇨🇴</button>
      <button data-lang="en" aria-pressed="false">🇬🇧</button>
      <button data-lang="fr" aria-pressed="false">🇫🇷</button>
    </div>
  </div>
  <div class="menu" id="menu"></div>
</nav>

<div class="wrap">

  <section class="pagina activa" id="p-inicio">
    <img class="portada" src="img/portada.jpg" alt="María y Adam">
    <p class="eyebrow" data-t="eyebrow"></p>
    <p class="fecha" data-t="fechaLugar"></p>
    <div class="cuenta" id="cuenta"></div>
    <div class="acciones">
      <button id="btnCal" data-t="btnCal"></button>
      <button id="btnWa" data-t="btnWa"></button>
    </div>
  </section>

  <section class="pagina" id="p-rsvp">
    <div class="tit"><h2 data-t="rsvpTit"></h2><p data-t="rsvpSub"></p></div>
    <div class="ticket">
      <div id="formulario">
        <label data-t="lNombre" for="nombre"></label>
        <input id="nombre" type="text" data-ph="phNombre" autocomplete="name">
        <label data-t="lViene"></label>
        <div class="opciones" id="asiste">
          <button type="button" data-v="si" aria-pressed="false" data-t="oSi"></button>
          <button type="button" data-v="no" aria-pressed="false" data-t="oNo"></button>
        </div>
        <div class="fila">
          <div><label data-t="lAcomp" for="acomp"></label>
            <select id="acomp"><option>0</option><option>1</option><option>2</option><option>3</option></select></div>
          <div><label data-t="lBus" for="bus"></label><select id="bus"></select></div>
        </div>
        <label data-t="lComida" for="comida"></label>
        <input id="comida" type="text" data-ph="phComida">
        <label data-t="lNota" for="nota"></label>
        <textarea id="nota" data-ph="phNota"></textarea>
        <button class="enviar" id="enviar" data-t="btnEnviar"></button>
        <p class="aviso" data-t="avisoRsvp"></p>
      </div>
      <div id="gracias" hidden></div>
    </div>
  </section>

  <section class="pagina" id="p-dia">
    <div class="tit"><h2 data-t="diaTit"></h2><p data-t="diaSub"></p></div>
    <div class="card" id="horario"></div>
  </section>

  <section class="pagina" id="p-llegar">
    <div class="tit"><h2 data-t="llegarTit"></h2><p data-t="llegarSub"></p></div>
    <div class="card">
      <h3>Domaine Sainte-Raphine</h3>
      <p data-t="lugarTxt"></p>
      <a class="enlace" href="https://maps.app.goo.gl/hUN1VAC6Tah4Lzrp7" target="_blank" rel="noopener" data-t="verMapa"></a><br>
      <a class="enlace" href="https://www.sainte-raphine.fr" target="_blank" rel="noopener" data-t="verWeb"></a>
    </div>
    <div class="card"><h3 data-t="avionTit"></h3><p data-t="avionTxt"></p></div>
    <div class="card"><h3 data-t="busTit"></h3><p data-t="busTxt"></p></div>
    <div class="card"><h3 data-t="cocheTit"></h3><p data-t="cocheTxt"></p></div>
    <div class="card">
      <h3 data-t="vtcTit"></h3><p data-t="vtcTxt"></p>
      <a class="enlace" id="uber" target="_blank" rel="noopener">Uber</a>
      &nbsp;&nbsp;<a class="enlace" href="https://bolt.eu" target="_blank" rel="noopener">Bolt</a>
    </div>
  </section>

  <section class="pagina" id="p-hoteles">
    <div class="tit"><h2 data-t="hotTit"></h2><p data-t="hotSub"></p></div>
    <div id="listaHoteles"></div>
    <p class="aviso claro" data-t="hotAviso"></p>
  </section>

  <section class="pagina" id="p-burdeos">
    <div class="tit"><h2 data-t="burTit"></h2><p data-t="burSub"></p></div>
    <p class="intro" data-t="burTxt"></p>
    <div id="listaBurdeos"></div>
  </section>

  <section class="pagina" id="p-vestuario">
    <div class="tit"><h2 data-t="vesTit"></h2><p data-t="vesSub"></p></div>
    <div class="card">
      <h3 data-t="vesH3"></h3><p data-t="vesTxt"></p>
      <div class="tags" id="tagsVes"></div>
    </div>
    <div class="card">
      <h3 data-t="florTit"></h3><p data-t="florTxt"></p>
      <div class="paleta">
        <span style="background:#E8720F"></span><span style="background:#E0507A"></span>
        <span style="background:#F07A20"></span><span style="background:#D9639B"></span>
        <span style="background:#F3C9AC"></span><span style="background:#EE7BA8"></span>
        <span style="background:#F2E3D0"></span><span style="background:#E8207A"></span>
        <span style="background:#82A07C"></span><span style="background:#FF4C25"></span>
      </div>
    </div>
  </section>

  <section class="pagina" id="p-album">
    <div class="tit"><h2 data-t="albTit"></h2><p data-t="albSub"></p></div>
    <div class="card"><p data-t="albTxt" style="font-style:italic"></p></div>
    <div class="album" id="album"></div>
  </section>

  <section class="pagina" id="p-deseos">
    <div class="tit"><h2 data-t="desTit"></h2><p data-t="desSub"></p></div>
    <div class="card">
      <label data-t="lDeQuien" for="deNombre"></label>
      <input id="deNombre" type="text" data-ph="phNombre">
      <label data-t="lDeseo" for="deTexto"></label>
      <textarea id="deTexto" data-ph="phDeseo"></textarea>
      <div class="check"><input type="checkbox" id="dePrivado"><label for="dePrivado" style="margin:0;text-transform:none;letter-spacing:0;font-family:var(--texto);font-size:14px;opacity:.9" data-t="lPrivado"></label></div>
      <button class="enviar" id="btnDeseo" data-t="btnDeseo"></button>
    </div>
    <div class="corcho"><div class="notas" id="muro"></div></div>
  </section>

  <section class="pagina" id="p-playlist">
    <div class="tit"><h2 data-t="plTit"></h2><p data-t="plSub"></p></div>
    <iframe class="spot" id="spotEmbed" loading="lazy" allow="encrypted-media" title="Playlist"></iframe>
    <div class="card">
      <p data-t="plTxt"></p>
      <a class="btn-grande" id="spotify" target="_blank" rel="noopener" data-t="plLink"></a>
    </div>
    <div class="card">
      <h3 data-t="plPideTit"></h3>
      <label data-t="lCancion" for="tema"></label>
      <input id="tema" type="text" data-ph="phCancion">
      <label data-t="lArtista" for="artista"></label>
      <input id="artista" type="text" data-ph="phArtista">
      <button class="enviar" id="agregar" data-t="btnCancion"></button>
    </div>
    <div class="card" id="listaCanciones"></div>
  </section>

  <section class="pagina" id="p-fotos">
    <div class="tit"><h2 data-t="fotTit"></h2><p data-t="fotSub"></p></div>
    <div class="card">
      <h3 data-t="fotH3"></h3><p data-t="fotTxt"></p>
      <a class="btn-grande" id="btnFotos" href="#" target="_blank" rel="noopener" data-t="btnFotos"></a>
    </div>
    <div class="rollo" aria-hidden="true"><div class="frames" id="frames"></div></div>
    <p class="aviso claro" data-t="fotAviso"></p>

    fotTit:"Les photos de tout le monde", fotSub:"20 photos par invité", fotH3:"Votre téléphone est un appareil jetable",
    fotTxt:"Ouvrez le lien, prenez vos 20 photos, c'est tout. Elles arrivent toutes dans le même album et se développent dimanche matin.",

         ["Je peux publier des photos ?","Après la cérémonie, oui. Taguez #MariaYAdam2027."]],
    panTit:"Tableau de bord de María et Adam", panSub:"Réservé aux mariés",

    cifras:["Présents","Absents","Navette"], sinRsvp:"Pas encore de réponses.",

    pie:"Fait avec amour", verPanel:"Tableau des mariés", verPost:"Aperçu du mode après-mariage",
    postEyebrow:"On s'est mariés", postTxt:"Merci d'être venus.\nLes photos de chacun, la playlist finale et le liège des voeux sont là.",

};

const PAGINAS = ["inicio","rsvp","dia","llegar","hoteles","burdeos","vestuario","album","deseos","playlist","fotos","faq"];
let lang = "es";
let postBoda = new Date() > new Date(new Date(FECHA_BODA).getTime() + 36*3600000);

const memoria = {};
async function leer(clave){
  try{ const r = await window.storage.get(clave, true); return r ? JSON.parse(r.value) : null; }
  catch(e){ return memoria[clave] ?? null; }
}
async function guardar(clave, valor){
  memoria[clave] = valor;
  try{ await window.storage.set(clave, JSON.stringify(valor), true); }catch(e){}
}

function ir(pag){
  PAGINAS.forEach(p => document.getElementById("p-"+p).classList.toggle("activa", p===pag));
  document.querySelectorAll("#menu button").forEach(b =>
    b.dataset.pag===pag ? b.setAttribute("aria-current","page") : b.removeAttribute("aria-current"));
  window.scrollTo(0,0);
  history.replaceState(null,"","#"+pag);
}
document.getElementById("logo").addEventListener("click", ()=> ir("inicio"));

function traducir(){
  const t = T[lang];
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-t]").forEach(el=>{
    const v = t[el.dataset.t];
    if(typeof v === "string") el.textContent = v;
  });
  document.querySelectorAll("[data-ph]").forEach(el=> el.placeholder = t[el.dataset.ph]);

  const activa = PAGINAS.find(p => document.getElementById("p-"+p).classList.contains("activa")) || "inicio";
  document.getElementById("menu").innerHTML = t.menu.map((m,i)=>
    `<button data-pag="${PAGINAS[i]}"${PAGINAS[i]===activa?' aria-current="page"':''}>${m}</button>`).join("");
  document.querySelectorAll("#menu button").forEach(b=>
    b.addEventListener("click", ()=> ir(b.dataset.pag)));

  document.getElementById("bus").innerHTML = t.busOps.map(o=>`<option>${o}</option>`).join("");
  document.getElementById("horario").innerHTML = t.horario.map(([h,tit,txt])=>
    `<div class="hora"><time>${h}</time><div><strong>${tit}</strong><em>${txt}</em></div></div>`).join("");
  document.getElementById("tagsVes").innerHTML = t.tags.map(([c,x])=>`<span class="tag ${c}">${x}</span>`).join("");
  document.getElementById("faqLista").innerHTML = t.faq.map(([p,r])=>
    `<details><summary>${p}</summary><p>${r}</p></details>`).join("");

  document.getElementById("listaHoteles").innerHTML = HOTELES.map(h=>
    `<div class="card"><h3>${h.n}</h3><p>${h.d[lang]}</p><a class="enlace" href="${h.u}" target="_blank" rel="noopener">${t.verMapa}</a></div>`).join("");
  document.getElementById("listaBurdeos").innerHTML = BURDEOS.map(b=>
    `<div class="card"><p class="etiqueta">${b.t[lang]}</p><h3>${b.n}</h3><p>${b.d[lang]}</p><a class="enlace" href="${b.u}" target="_blank" rel="noopener">${t.verMapa}</a></div>`).join("");

  document.getElementById("btnFotos").href = URL_FOTOS;
  document.getElementById("spotify").href = URL_SPOTIFY;
  document.getElementById("spotEmbed").src = "https://open.spotify.com/embed/playlist/" + ID_SPOTIFY;
  document.getElementById("uber").href =
    "https://m.uber.com/ul/?action=setPickup&pickup=my_location&dropoff%5Bformatted_address%5D=" +
    encodeURIComponent("Domaine Sainte-Raphine, Fargues-Saint-Hilaire");

  if(postBoda){
    document.querySelector(".eyebrow").textContent = t.postEyebrow;
    document.querySelector(".fecha").textContent = t.postTxt;
  }
  document.querySelectorAll(".idioma button").forEach(b=> b.setAttribute("aria-pressed", b.dataset.lang===lang));
  pintaCuenta(); pintaMuro(); pintaLista();
}
document.querySelectorAll(".idioma button").forEach(b=>
  b.addEventListener("click", ()=>{ lang = b.dataset.lang; traducir(); }));

function pintaCuenta(){
  const cuenta = document.getElementById("cuenta");
  if(postBoda){ cuenta.innerHTML = ""; return; }
  const falta = new Date(FECHA_BODA) - new Date();
  const d = Math.max(0, Math.floor(falta/86400000));
  const h = Math.max(0, Math.floor(falta/3600000)%24);
  const m = Math.max(0, Math.floor(falta/60000)%60);
  cuenta.innerHTML = [[d,T[lang].dias],[h,T[lang].horas],[m,T[lang].min]]
    .map(([n,l])=>`<div><b>${n}</b><span>${l}</span></div>`).join("");
}
setInterval(pintaCuenta, 30000);

document.getElementById("btnCal").addEventListener("click", ()=>{
  const f = d => d.toISOString().replace(/[-:]/g,"").split(".")[0]+"Z";
  const ini = new Date(FECHA_BODA), fin = new Date(ini.getTime()+11.5*3600000);
  const ics = ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//maria-adam//ES","BEGIN:VEVENT",
    "UID:maria-adam-2027@boda","DTSTAMP:"+f(new Date()),"DTSTART:"+f(ini),"DTEND:"+f(fin),
    "SUMMARY:"+T[lang].calTitulo,"LOCATION:Domaine Sainte-Raphine, Fargues-Saint-Hilaire",
    "END:VEVENT","END:VCALENDAR"].join("\r\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([ics],{type:"text/calendar"}));
  a.download = "maria-adam-2027.ics"; a.click();
});
document.getElementById("btnWa").addEventListener("click", ()=>{
  window.open("https://wa.me/"+WHATSAPP+"?text="+encodeURIComponent(
    lang==="es" ? "Hola! Tengo una duda sobre la boda:" :
    lang==="fr" ? "Bonjour ! J'ai une question sur le mariage :" :
                  "Hi! A question about the wedding:"),"_blank");
});

let asiste = null;
document.querySelectorAll("#asiste button").forEach(b=>{
  b.addEventListener("click", ()=>{
    asiste = b.dataset.v;
    document.querySelectorAll("#asiste button").forEach(x=>x.setAttribute("aria-pressed", x===b));
  });
});
async function aGoogleForm(d){
  if(!FORM_ID) return;
  const p = new URLSearchParams();
  p.append(CAMPOS.nombre,d.nombre); p.append(CAMPOS.asiste,d.asiste);
  p.append(CAMPOS.acomp,d.acompanantes); p.append(CAMPOS.bus,d.bus);
  p.append(CAMPOS.comida,d.comida); p.append(CAMPOS.nota,d.nota);
  try{ await fetch("https://docs.google.com/forms/d/e/"+FORM_ID+"/formResponse?"+p.toString(),{method:"POST",mode:"no-cors"}); }catch(e){}
}
document.getElementById("enviar").addEventListener("click", async ()=>{
  const nombre = document.getElementById("nombre").value.trim();
  if(!nombre){ document.getElementById("nombre").focus(); return; }
  if(!asiste){ document.querySelector("#asiste button").focus(); return; }
  const datos = { nombre, asiste,
    acompanantes: document.getElementById("acomp").value,
    bus: document.getElementById("bus").value,
    comida: document.getElementById("comida").value.trim(),
    nota: document.getElementById("nota").value.trim(),
    enviado: new Date().toISOString() };
  const lista = (await leer("rsvp")) || [];
  lista.push(datos); await guardar("rsvp", lista);
  aGoogleForm(datos);
  document.getElementById("formulario").hidden = true;
  const g = document.getElementById("gracias"); g.hidden = false;
  g.innerHTML = asiste === "si" ? T[lang].graciasSi(nombre.split(" ")[0]) : T[lang].graciasNo;
});

const PAPELES = ["#FBF3D5","#FDE2D0","#F6DCE6","#E4EEDC","#FBE9C8","#E9E2F2"];
async function pintaMuro(){
  const todos = (await leer("deseos")) || [];
  const publicos = todos.filter(d=>!d.privado);
  const muro = document.getElementById("muro");
  muro.innerHTML = publicos.length
    ? publicos.map((d,i)=>`<div class="nota" style="background:${PAPELES[i%PAPELES.length]}"><p>“${d.texto}”</p><b>${d.nombre}</b></div>`).join("")
    : `<p class="vacio">${T[lang].muroVacio}</p>`;
}
document.getElementById("btnDeseo").addEventListener("click", async ()=>{
  const nombre = document.getElementById("deNombre").value.trim() || "Anónimo";
  const texto = document.getElementById("deTexto").value.trim();
  if(!texto){ document.getElementById("deTexto").focus(); return; }
  const todos = (await leer("deseos")) || [];
  todos.push({nombre, texto, privado: document.getElementById("dePrivado").checked});
  await guardar("deseos", todos);
  document.getElementById("deTexto").value = "";
  document.getElementById("dePrivado").checked = false;
  pintaMuro();
});

async function pintaLista(){
  const canciones = (await leer("playlist")) || [];
  document.getElementById("listaCanciones").innerHTML = canciones.length
    ? canciones.map((c,i)=>`<div class="cancion"><span>${String(i+1).padStart(2,"0")}</span><div><strong>${c.tema}</strong> <em>· ${c.artista}</em></div></div>`).join("")
    : `<p>${T[lang].plVacia}</p>`;
}
document.getElementById("agregar").addEventListener("click", async ()=>{
  const tema = document.getElementById("tema").value.trim();
  if(!tema){ document.getElementById("tema").focus(); return; }
  const canciones = (await leer("playlist")) || [];
  canciones.push({tema, artista: document.getElementById("artista").value.trim() || "—"});
  await guardar("playlist", canciones);
  document.getElementById("tema").value = ""; document.getElementById("artista").value = "";
  pintaLista();
});

(function(){
  const cajaAlbum = document.getElementById("album");
  for(let i=1;i<=NUM_ALBUM;i++){
    const im = document.createElement("img");
    im.src = "img/album/foto-" + String(i).padStart(2,"0") + ".jpg";
    im.loading = "lazy"; im.alt = "";
    im.addEventListener("click", ()=>{
      document.getElementById("lupaImg").src = im.src;
      document.getElementById("lupa").classList.add("abierta");
    });
    cajaAlbum.appendChild(im);
  }
  const cerrar = ()=> document.getElementById("lupa").classList.remove("abierta");
  document.getElementById("cerrarLupa").addEventListener("click", cerrar);
  document.getElementById("lupa").addEventListener("click", e=>{ if(e.target.id==="lupa") cerrar(); });
  document.addEventListener("keydown", e=>{ if(e.key==="Escape") cerrar(); });
})();

const frames = document.getElementById("frames");
for(let i=1;i<=TOPE_FOTOS;i++){
  const f = document.createElement("div");
  f.className = "frame"; f.textContent = String(i).padStart(2,"0");
  f.addEventListener("click", ()=>f.classList.toggle("usado"));
  frames.appendChild(f);
}

document.getElementById("verPanel").addEventListener("click", ()=>{
  const p = document.getElementById("panel");
  p.hidden = false; p.scrollIntoView({behavior:"smooth"});
  document.getElementById("pin").focus();
});
document.getElementById("btnPin").addEventListener("click", async ()=>{
  if(document.getElementById("pin").value !== PIN_NOVIOS){
    document.getElementById("pin").value = "";
    document.getElementById("pin").placeholder = T[lang].pinMal; return;
  }
  document.getElementById("panLogin").hidden = true;
  const caja = document.getElementById("panDatos"); caja.hidden = false;
  const t = T[lang];
  const lista = (await leer("rsvp")) || [];
  const deseos = ((await leer("deseos")) || []).filter(d=>d.privado);
  const vienen = lista.filter(x=>x.asiste==="si").reduce((n,x)=>n+1+Number(x.acompanantes||0),0);
  const nop = lista.filter(x=>x.asiste==="no").length;
  const bus = lista.filter(x=>x.asiste==="si" && x.bus===t.busOps[0]).reduce((n,x)=>n+1+Number(x.acompanantes||0),0);
  caja.innerHTML =
    '<div class="cifras"><div><b>'+vienen+'</b><span>'+t.cifras[0]+'</span></div>' +
    '<div><b>'+nop+'</b><span>'+t.cifras[1]+'</span></div>' +
    '<div><b>'+bus+'</b><span>'+t.cifras[2]+'</span></div></div>' +
    (lista.length ? lista.map(x=>
      '<div class="invitado"><b>'+x.nombre+'</b> '+(x.asiste==="si"?"✓":"✗")+' '+(Number(x.acompanantes)?"+"+x.acompanantes:"")+
      '<em>'+[x.bus, x.comida, x.nota].filter(Boolean).join(" · ")+'</em></div>').join("")
      : "<p>"+t.sinRsvp+"</p>") +
    '<h3 style="font-family:var(--display);font-size:20px;margin:22px 0 6px">'+t.panDeseos+'</h3>' +
    (deseos.length ? deseos.map(d=>
      '<div class="invitado"><span class="privado">'+t.privado+'</span><br>“'+d.texto+'”<em>'+d.nombre+'</em></div>').join("")
      : "<p>"+t.sinDeseos+"</p>");
});

document.getElementById("verPost").addEventListener("click", ()=>{
  postBoda = !postBoda;
  if(!postBoda){
    document.querySelector(".eyebrow").textContent = T[lang].eyebrow;
    document.querySelector(".fecha").textContent = T[lang].fechaLugar;
  }
  traducir(); ir("inicio");
});

(function(){
  const flores = ["flor-crema","flor-durazno","flor-rosa","flor-lila","flor-hibisco","flor-amarilla"];
  const sitios = [[4,9,52,-14],[93,18,40,22],[6,41,44,9],[95,60,54,-25],[3,76,38,17],[96,90,48,-8],[52,97,42,20]];
  const capa = document.createElement("div");
  capa.className = "jardin"; capa.setAttribute("aria-hidden","true");
  sitios.forEach(([x,y,tam,giro],i)=>{
    const f = document.createElement("img");

    f.loading = "lazy"; f.alt = "";
    f.style.cssText = "left:"+x+"%;top:"+y+"%;width:"+tam+"px;transform:translate(-50%,-50%) rotate("+giro+"deg)";
    capa.appendChild(f);
  });
  document.body.appendChild(capa);
})();

traducir();
const inicial = location.hash.replace("#","");
ir(PAGINAS.includes(inicial) ? inicial : "inicio");

if("serviceWorker" in navigator){
  let recargando = false;
  navigator.serviceWorker.addEventListener("controllerchange", ()=>{
    if(recargando) return;
    recargando = true; location.reload();
  });
  window.addEventListener("load", async ()=>{
    try{
      const reg = await navigator.serviceWorker.register("sw.js", {updateViaCache:"none"});
      reg.update();
      document.addEventListener("visibilitychange", ()=>{ if(!document.hidden) reg.update(); });
      setInterval(()=> reg.update(), 60*60*1000);
    }catch(e){}
  });
}
