<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Majo & Adam · 24 abril 2027</title>
<meta name="description" content="Toda la información de la boda de Majo y Adam: cómo llegar, dónde dormir, qué ponerte y confirmar tu asistencia.">
<meta name="theme-color" content="#FBF3E2">
<link rel="icon" href="favicon.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<meta property="og:type" content="website">
<meta property="og:title" content="Majo & Adam · 24 abril 2027">
<meta property="og:description" content="Domaine Sainte-Raphine, Burdeos. Confirma tu asistencia aquí.">
<meta property="og:image" content="og.jpg">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Outfit:wght@300;400;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

<style>
  :root{
    --crema:#FBF3E2; --card:#FFFDF6; --tinta:#3B3826;
    --fram:#CA3E67; --framD:#9E2F4F;
    --oliva:#495A34; --mostaza:#D8BA3B; --rosa:#E494AC; --amarillo:#F8E64F;
    --linea:rgba(59,56,38,.15);
    --display:"Baloo 2","Trebuchet MS",cursive;
    --texto:"Outfit","Segoe UI",system-ui,sans-serif;
    --util:"Space Mono",ui-monospace,monospace;
  }
  *{box-sizing:border-box}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
  body{margin:0;background:var(--crema);color:var(--tinta);font-family:var(--texto);font-weight:300;font-size:16px;line-height:1.55;position:relative;overflow-x:hidden;min-height:100vh}
  .jardin{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
  .jardin img{position:absolute;opacity:.88;filter:drop-shadow(0 3px 6px rgba(59,56,38,.16))}
  .wrap{max-width:560px;margin:0 auto;padding:0 20px 80px;position:relative;z-index:1}

  .nav{position:sticky;top:0;z-index:20;background:rgba(251,243,226,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--linea)}
  .nav-top{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:8px;padding:9px 20px 2px}
  .logo{font-family:var(--display);font-weight:800;font-size:17px;color:var(--fram);background:none;border:none;cursor:pointer;padding:0}
  .idioma{margin-left:auto;display:flex;gap:2px;background:var(--card);border:1px solid var(--linea);border-radius:999px;padding:3px}
  .idioma button{border:none;background:none;font-size:14px;line-height:1;padding:5px 7px;border-radius:999px;cursor:pointer;opacity:.4;font-family:var(--util)}
  .idioma button[aria-pressed="true"]{opacity:1;background:var(--rosa)}
  .menu{max-width:560px;margin:0 auto;display:flex;gap:7px;overflow-x:auto;padding:9px 20px;scrollbar-width:none}
  .menu::-webkit-scrollbar{display:none}
  .menu button{flex:0 0 auto;font-family:var(--util);font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--tinta);border:1px solid var(--linea);border-radius:999px;padding:7px 13px;background:var(--card);cursor:pointer;opacity:.8}
  .menu button[aria-current="page"]{background:var(--fram);color:#fff;border-color:var(--fram);opacity:1}
  a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--fram);outline-offset:2px}

  .pagina{display:none;padding-top:28px}
  .pagina.activa{display:block;animation:entra .28s ease}
  @keyframes entra{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .tit{background:var(--card);border-radius:16px;padding:13px 18px 14px;display:inline-block;margin:0 0 16px;box-shadow:0 4px 12px rgba(59,56,38,.1)}
  .tit h2{font-family:var(--display);font-weight:800;font-size:29px;line-height:1;margin:0;color:var(--fram)}
  .tit p{font-family:var(--util);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;margin:5px 0 0;opacity:.55}

  .card{background:var(--card);border-radius:18px;padding:18px;margin-bottom:12px;box-shadow:0 5px 16px rgba(59,56,38,.1)}
  .card h3{margin:0 0 4px;font-family:var(--display);font-weight:600;font-size:19px;color:var(--oliva)}
  .card p{margin:0;font-size:14.5px;opacity:.85}
  .etiqueta{font-family:var(--util);font-size:10px;letter-spacing:.1em;text-transform:uppercase;opacity:.5;margin-bottom:6px}
  .enlace{display:inline-block;margin-top:10px;font-family:var(--util);font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--fram);text-decoration:none;border-bottom:1.5px solid var(--fram);padding-bottom:2px}
  .intro{color:var(--oliva);font-size:14.5px;margin:0 0 14px;font-weight:400}

  .portada{width:100%;display:block;filter:drop-shadow(0 10px 22px rgba(59,56,38,.22))}
  .eyebrow{font-family:var(--util);font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--fram);margin:22px 0 0;text-align:center}
  .fecha{font-family:var(--display);font-weight:600;font-size:22px;color:var(--oliva);margin:6px 0 0;text-align:center;line-height:1.3;white-space:pre-line}
  .cuenta{display:flex;justify-content:center;gap:10px;margin-top:22px}
  .cuenta div{flex:0 0 auto}
  .cuenta div{background:var(--card);border-radius:14px;padding:11px 4px;width:74px;text-align:center;box-shadow:0 4px 12px rgba(59,56,38,.1)}
  .cuenta b{display:block;font-family:var(--display);font-weight:800;font-size:27px;line-height:1;color:var(--fram)}
  .cuenta span{font-family:var(--util);font-size:9px;letter-spacing:.08em;text-transform:uppercase;opacity:.6}
  .acciones{display:flex;gap:9px;margin-top:24px}
  .acciones button{flex:1;font-family:var(--display);font-weight:600;font-size:15px;padding:13px 8px;border-radius:14px;border:none;background:var(--card);color:var(--tinta);cursor:pointer;box-shadow:0 4px 0 rgba(59,56,38,.16)}
  .acciones button:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(59,56,38,.16)}

  .hora{display:flex;gap:14px;padding:12px 0;border-bottom:1px dashed var(--linea)}
  .hora:last-child{border:none}
  .hora time{font-family:var(--util);font-weight:700;font-size:13px;flex:0 0 52px;color:var(--fram)}
  .hora strong{display:block;font-weight:600;font-size:15px}
  .hora em{font-style:normal;font-size:13.5px;opacity:.7}

  .paleta{display:flex;gap:9px;margin:14px 0 4px}
  .paleta span{flex:1;aspect-ratio:1;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(59,56,38,.1)}
  .floresgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:14px}
  .floresgrid img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:16px;box-shadow:0 4px 10px rgba(59,56,38,.14)}
  .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
  .tag{font-family:var(--util);font-size:11px;padding:5px 10px;border-radius:999px;border:1px solid var(--linea)}
  .si{background:rgba(73,90,52,.18)} .no{background:rgba(202,62,103,.14)}

  label{display:block;font-family:var(--util);font-size:11px;letter-spacing:.08em;text-transform:uppercase;opacity:.6;margin:14px 0 5px}
  input,select,textarea{width:100%;font-family:var(--texto);font-size:16px;padding:11px 13px;border:1px solid var(--linea);border-radius:12px;background:#fff;color:var(--tinta)}
  textarea{min-height:76px;resize:vertical}
  .fila{display:flex;gap:10px}.fila>*{flex:1}
  .opciones{display:flex;gap:8px;margin-top:5px}
  .opciones button{flex:1;font-family:var(--texto);font-size:14px;padding:11px;border-radius:12px;border:1px solid var(--linea);background:#fff;color:var(--tinta);cursor:pointer}
  .opciones button[aria-pressed="true"]{background:var(--oliva);color:#fff;border-color:var(--oliva)}
  .enviar{width:100%;margin-top:20px;font-family:var(--display);font-weight:800;font-size:20px;padding:14px;border:none;border-radius:14px;background:var(--fram);color:#fff;cursor:pointer;box-shadow:0 5px 0 var(--framD)}
  .enviar:active{transform:translateY(3px);box-shadow:0 2px 0 var(--framD)}
  .aviso{font-family:var(--util);font-size:11px;margin-top:12px;opacity:.55;text-align:center}
  .aviso.claro{color:var(--oliva);opacity:.8}
  .check{display:flex;align-items:center;gap:9px;margin-top:14px;font-size:14px}
  .check input{width:auto}
  .ticket{position:relative;background:var(--card);border-radius:18px;padding:20px;box-shadow:0 5px 16px rgba(59,56,38,.12)}
  .ticket::before,.ticket::after{content:"";position:absolute;width:22px;height:22px;background:var(--crema);border-radius:50%;top:calc(50% - 11px)}
  .ticket::before{left:-11px}.ticket::after{right:-11px}

  .album{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .album img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:8px;background:#fff;padding:6px;box-shadow:0 5px 12px rgba(59,56,38,.16);cursor:pointer;display:block}
  .album img:nth-child(4n){transform:rotate(1.4deg)}
  .album img:nth-child(4n+3){transform:rotate(-1.6deg)}
  .lupa{position:fixed;inset:0;background:rgba(59,56,38,.92);z-index:50;display:none;align-items:center;justify-content:center;padding:20px}
  .lupa.abierta{display:flex}
  .lupa img{max-width:100%;max-height:86vh;border-radius:8px;background:#fff;padding:8px}
  .lupa button{position:absolute;top:18px;right:18px;background:#fff;border:none;border-radius:999px;width:40px;height:40px;font-size:18px;cursor:pointer}

  .corcho{background:url("img/corcho.jpg") repeat;background-size:300px;border-radius:14px;padding:18px 14px 24px;box-shadow:inset 0 0 40px rgba(59,42,22,.35),0 6px 16px rgba(59,56,38,.2);border:9px solid #A9793F}
  .notas{display:flex;flex-wrap:wrap;gap:14px}
  .nota{position:relative;flex:1 1 44%;min-width:142px;padding:18px 13px 13px;border-radius:3px;font-size:14px;box-shadow:2px 4px 9px rgba(46,42,22,.32);line-height:1.4;color:#3B3826}
  .nota:nth-child(4n){transform:rotate(-2deg)}
  .nota:nth-child(4n+1){transform:rotate(1.6deg)}
  .nota:nth-child(4n+2){transform:rotate(-.8deg)}
  .nota:nth-child(4n+3){transform:rotate(2.2deg)}
  .nota::before{content:"";position:absolute;top:-6px;left:50%;transform:translateX(-50%);width:13px;height:13px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#E06A88,#9E2F4F);box-shadow:0 2px 3px rgba(46,42,22,.5)}
  .nota p{margin:0 0 8px;font-style:italic}
  .nota b{font-family:var(--util);font-size:10px;letter-spacing:.06em;text-transform:uppercase;opacity:.65;font-weight:400}
  .quitar{position:absolute;top:4px;right:5px;width:20px;height:20px;border:none;border-radius:50%;background:rgba(46,42,22,.14);color:var(--tinta);font-size:11px;line-height:1;cursor:pointer;padding:0}
  .quitar:hover{background:var(--fram);color:#fff}
  .vacio{color:var(--crema);font-family:var(--util);font-size:12px;text-align:center;padding:26px 10px;width:100%;text-shadow:0 1px 3px rgba(46,42,22,.6)}

  .cancion{display:flex;gap:10px;align-items:baseline;padding:9px 0;border-bottom:1px dashed var(--linea);position:relative;padding-right:26px}
  .cancion:last-child{border:none}
  .cancion .quitar{top:8px}
  .cancion span{font-family:var(--util);font-size:11px;opacity:.45;flex:0 0 24px}
  .cancion strong{font-weight:600;font-size:15px}
  .cancion em{font-style:normal;opacity:.6;font-size:13.5px}
  .spot{width:100%;height:352px;border:none;border-radius:14px;margin-bottom:12px;background:var(--card)}
  .rollo{margin:16px -20px;padding:16px 0;background:var(--oliva);border-top:14px solid transparent;border-bottom:14px solid transparent;background-clip:padding-box;position:relative;overflow-x:auto;scrollbar-width:none}
  .rollo::-webkit-scrollbar{display:none}
  .rollo::before,.rollo::after{content:"";position:absolute;left:0;right:0;height:14px;background-image:repeating-linear-gradient(90deg,var(--crema) 0 9px,transparent 9px 20px)}
  .rollo::before{top:-14px}.rollo::after{bottom:-14px}
  .frames{display:flex;gap:8px;padding:0 20px;min-width:min-content}
  .frame{flex:0 0 62px;height:62px;border-radius:6px;border:1px solid rgba(251,243,226,.3);display:flex;align-items:center;justify-content:center;font-family:var(--util);font-size:11px;color:rgba(251,243,226,.55);cursor:pointer}
  .frame.usado{background:var(--amarillo);color:var(--oliva);border-color:var(--amarillo)}
  .btn-grande{display:block;text-align:center;text-decoration:none;margin-top:14px;font-family:var(--display);font-weight:800;font-size:19px;padding:14px;border-radius:14px;background:var(--fram);color:#fff;box-shadow:0 5px 0 var(--framD)}
  .btn-sec{display:block;text-align:center;text-decoration:none;margin-top:10px;font-family:var(--util);font-size:12px;letter-spacing:.06em;text-transform:uppercase;padding:11px;border-radius:12px;border:1px solid var(--linea);color:var(--tinta)}

  .regalo p{font-size:15px;opacity:.9;line-height:1.6}
  .cuentas{margin-top:16px;display:flex;flex-direction:column;gap:10px}
  .cuentas div{background:var(--crema);border-radius:12px;padding:12px 14px}
  .cuentas span{display:block;font-family:var(--util);font-size:10px;letter-spacing:.1em;text-transform:uppercase;opacity:.55;margin-bottom:3px}
  .cuentas b{font-family:var(--util);font-size:14px;letter-spacing:.02em;color:var(--fram)}

  .panel{background:var(--oliva);color:var(--crema);border-radius:18px;padding:20px;margin-top:28px}
  .panel .tit{background:rgba(251,243,226,.12);box-shadow:none}
  .panel .tit h2{color:var(--crema);font-size:24px}
  .panel .tit p{color:rgba(251,243,226,.6);opacity:1}
  .panel input{background:rgba(251,243,226,.1);border-color:rgba(251,243,226,.25);color:var(--crema)}
  .panel label{color:rgba(251,243,226,.6)}
  .cifras{display:flex;gap:8px;margin:16px 0}
  .cifras div{flex:1;background:rgba(251,243,226,.1);border-radius:12px;padding:12px 8px;text-align:center}
  .cifras b{display:block;font-family:var(--display);font-weight:800;font-size:24px}
  .cifras span{font-family:var(--util);font-size:9px;letter-spacing:.06em;text-transform:uppercase;opacity:.6}
  .invitado{border-bottom:1px solid rgba(251,243,226,.16);padding:10px 0;font-size:14px}
  .invitado em{font-style:normal;display:block;font-size:12.5px;opacity:.65}
  .privado{font-family:var(--util);font-size:10px;color:var(--amarillo);letter-spacing:.06em;text-transform:uppercase}

  footer{text-align:center;margin-top:36px;font-family:var(--util);font-size:11px;color:var(--tinta);opacity:.6}
  footer button{background:none;border:none;font-family:var(--util);font-size:11px;color:var(--tinta);opacity:.85;cursor:pointer;text-decoration:underline;margin-top:8px}
</style>
</head>
<body>

<nav class="nav">
  <div class="nav-top">
    <button class="logo" id="logo">Majo &amp; Adam</button>
    <div class="idioma">
      <button data-lang="es" aria-pressed="true">🇨🇴</button>
      <button data-lang="en" aria-pressed="false">🇬🇧</button>
      <button data-lang="fr" aria-pressed="false">🇫🇷</button>
    </div>
  </div>
  <div class="menu" id="menu"></div>
</nav>

<div class="wrap">

  <section class="pagina activa" id="p-inicio">
    <img class="portada" src="img/portada.png" alt="Majo y Adam">
    <p class="eyebrow" data-t="eyebrow"></p>
    <p class="fecha" data-t="fechaLugar"></p>
    <div class="cuenta" id="cuenta"></div>
    <div class="acciones">
      <button id="btnCal" data-t="btnCal"></button>
      <button id="btnWa" data-t="btnWa"></button>
    </div>
    <div class="panel" id="panel" hidden>
      <div class="tit"><h2 data-t="panTit"></h2><p data-t="panSub"></p></div>
      <div id="panLogin">
        <label data-t="lPin" for="pin"></label>
        <input id="pin" type="password" inputmode="numeric" placeholder="••••">
        <button class="enviar" id="btnPin" data-t="btnPin"></button>
      </div>
      <div id="panDatos" hidden></div>
    </div>
    <footer>
      <div data-t="pie"></div>
      <button id="verPanel" data-t="verPanel"></button> ·
      <button id="verPost" data-t="verPost"></button>
    </footer>
  </section>

  <section class="pagina" id="p-rsvp">
    <div class="tit"><h2 data-t="rsvpTit"></h2><p data-t="rsvpSub"></p></div>
    <div class="ticket">
      <div id="formulario">
        <label data-t="lNombre" for="nombre"></label>
        <input id="nombre" type="text" data-ph="phNombre" autocomplete="name">
        <label data-t="lViene"></label>
        <div class="opciones" id="asiste">
          <button type="button" data-v="si" aria-pressed="false" data-t="oSi"></button>
          <button type="button" data-v="no" aria-pressed="false" data-t="oNo"></button>
        </div>
        <label data-t="lMenu" for="menusel"></label>
        <select id="menusel"></select>
        <label data-t="lNota" for="nota"></label>
        <textarea id="nota" data-ph="phNota"></textarea>
        <button class="enviar" id="enviar" data-t="btnEnviar"></button>
        <p class="aviso" data-t="avisoRsvp"></p>
      </div>
      <div id="gracias" hidden></div>
    </div>
  </section>

  <section class="pagina" id="p-dia">
    <div class="tit"><h2 data-t="diaTit"></h2><p data-t="diaSub"></p></div>
    <div class="card" id="horario"></div>
  </section>

  <section class="pagina" id="p-llegar">
    <div class="tit"><h2 data-t="llegarTit"></h2><p data-t="llegarSub"></p></div>
    <div class="card">
      <h3>Domaine Sainte-Raphine</h3>
      <p data-t="lugarTxt"></p>
      <a class="enlace" href="https://maps.app.goo.gl/hUN1VAC6Tah4Lzrp7" target="_blank" rel="noopener" data-t="verMapa"></a><br>
      <a class="enlace" href="https://www.sainte-raphine.fr" target="_blank" rel="noopener" data-t="verWeb"></a>
    </div>
    <div class="card"><h3 data-t="avionTit"></h3><p data-t="avionTxt"></p></div>
    <div class="card"><h3 data-t="cocheTit"></h3><p data-t="cocheTxt"></p></div>
    <div class="card">
      <h3 data-t="vtcTit"></h3><p data-t="vtcTxt"></p>
      <a class="enlace" id="uber" target="_blank" rel="noopener">Uber</a>
      &nbsp;&nbsp;<a class="enlace" href="https://bolt.eu" target="_blank" rel="noopener">Bolt</a>
    </div>
  </section>

  <section class="pagina" id="p-hoteles">
    <div class="tit"><h2 data-t="hotTit"></h2><p data-t="hotSub"></p></div>
    <div id="listaHoteles"></div>
    <p class="aviso claro" data-t="hotAviso"></p>
  </section>

  <section class="pagina" id="p-burdeos">
    <div class="tit"><h2 data-t="burTit"></h2><p data-t="burSub"></p></div>
    <p class="intro" data-t="burTxt"></p>
    <div id="listaBurdeos"></div>
  </section>

  <section class="pagina" id="p-vestuario">
    <div class="tit"><h2 data-t="vesTit"></h2><p data-t="vesSub"></p></div>
    <div class="card">
      <h3 data-t="vesH3"></h3><p data-t="vesTxt"></p>
      <div class="tags" id="tagsVes"></div>
    </div>
    <div class="card">
      <h3 data-t="florTit"></h3><p data-t="florTxt"></p>
      <div class="paleta">
        <span style="background:#CA3E67"></span><span style="background:#E494AC"></span>
        <span style="background:#D8BA3B"></span><span style="background:#F8E64F"></span>
        <span style="background:#495A34"></span>
      </div>
      <div class="floresgrid" id="floresVes"></div>
    </div>
  </section>

  <section class="pagina" id="p-album">
    <div class="tit"><h2 data-t="albTit"></h2><p data-t="albSub"></p></div>
    <div class="card"><p data-t="albTxt" style="font-style:italic"></p></div>
    <div class="album" id="album"></div>
  </section>

  <section class="pagina" id="p-deseos">
    <div class="tit"><h2 data-t="desTit"></h2><p data-t="desSub"></p></div>
    <div class="card">
      <label data-t="lDeQuien" for="deNombre"></label>
      <input id="deNombre" type="text" data-ph="phNombre">
      <label data-t="lDeseo" for="deTexto"></label>
      <textarea id="deTexto" data-ph="phDeseo"></textarea>
      <div class="check"><input type="checkbox" id="dePrivado"><label for="dePrivado" style="margin:0;text-transform:none;letter-spacing:0;font-family:var(--texto);font-size:14px;opacity:.9" data-t="lPrivado"></label></div>
      <button class="enviar" id="btnDeseo" data-t="btnDeseo"></button>
    </div>
    <div class="corcho"><div class="notas" id="muro"></div></div>
  </section>

  <section class="pagina" id="p-playlist">
    <div class="tit"><h2 data-t="plTit"></h2><p data-t="plSub"></p></div>

const PAGINAS = ["inicio","rsvp","dia","llegar","hoteles","burdeos","vestuario","album","deseos","playlist","fotos","regalo"];
let lang = "es";
let postBoda = new Date() > new Date(new Date(FECHA_BODA).getTime() + 36*3600000);

/* ---------- datos compartidos ----------
   Con API configurada, todo vive en la hoja de cálculo y lo ve todo el mundo.
   Sin API, la app funciona igual pero los datos se quedan en este dispositivo. */
let DATOS = { deseos:[], canciones:[], rsvp:[] };
let cargando = false;

let mios = [];
try{ mios = JSON.parse(localStorage.getItem("misNotas") || "[]"); }catch(e){}
function recuerdaMio(id){
  mios.push(id);
  try{ localStorage.setItem("misNotas", JSON.stringify(mios)); }catch(e){}
}
const esMio = id => mios.indexOf(id) !== -1;

function nuevoId(){
  return Date.now().toString(36) + Math.random().toString(36).slice(2,7);
}

async function cargar(){
  if(!API || cargando) return;
  cargando = true;
  try{
    const r = await fetch(API + "?t=" + Date.now());
    const j = await r.json();
    DATOS = { deseos:j.deseos||[], canciones:j.canciones||[], rsvp:j.rsvp||[] };
  }catch(e){}
  cargando = false;
}

async function anadir(tipo, datos){
  const id = nuevoId();
  DATOS[tipo].push(Object.assign({id}, datos));   // se ve al instante
  if(API){
    try{ await fetch(API, {method:"POST", body: JSON.stringify({accion:"anadir", tipo, datos: Object.assign({id}, datos)})}); }catch(e){}
  }
  return id;
}

async function borrar(tipo, id){
  DATOS[tipo] = DATOS[tipo].filter(x => x.id !== id);
  if(API){
    try{ await fetch(API, {method:"POST", body: JSON.stringify({accion:"borrar", tipo, id})}); }catch(e){}
  }
}

async function refrescar(){
  await cargar();
  pintaMuro(); pintaLista();
}

function ir(pag){
  PAGINAS.forEach(p => document.getElementById("p-"+p).classList.toggle("activa", p===pag));
  document.querySelectorAll("#menu button").forEach(b =>
    b.dataset.pag===pag ? b.setAttribute("aria-current","page") : b.removeAttribute("aria-current"));
  window.scrollTo(0,0);
  history.replaceState(null,"","#"+pag);
  if(pag==="deseos" || pag==="playlist") refrescar();
}
setInterval(()=>{
  const p = location.hash.replace("#","");
  if(p==="deseos" || p==="playlist") refrescar();
}, 45000);
document.getElementById("logo").addEventListener("click", ()=> ir("inicio"));

function traducir(){
  const t = T[lang];
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-t]").forEach(el=>{
    const v = t[el.dataset.t];
    if(typeof v === "string") el.textContent = v;
  });
  document.querySelectorAll("[data-ph]").forEach(el=> el.placeholder = t[el.dataset.ph]);

  const activa = PAGINAS.find(p => document.getElementById("p-"+p).classList.contains("activa")) || "inicio";
  document.getElementById("menu").innerHTML = t.menu.map((m,i)=>
    `<button data-pag="${PAGINAS[i]}"${PAGINAS[i]===activa?' aria-current="page"':''}>${m}</button>`).join("");
  document.querySelectorAll("#menu button").forEach(b=>
    b.addEventListener("click", ()=> ir(b.dataset.pag)));

  document.getElementById("menusel").innerHTML = t.menuOps.map(o=>`<option>${o}</option>`).join("");
  document.getElementById("horario").innerHTML = t.horario.map(([h,tit,txt])=>
    `<div class="hora"><time>${h}</time><div><strong>${tit}</strong><em>${txt}</em></div></div>`).join("");
  document.getElementById("tagsVes").innerHTML = t.tags.map(([c,x])=>`<span class="tag ${c}">${x}</span>`).join("");
  document.getElementById("floresVes").innerHTML = ["flor-calla","flor-clavel-rosa","flor-gerbera","flor-ranunculo-am","flor-peonia","flor-stock","flor-dragon","flor-ranunculo-rosa","flor-clavel-crema"].map(f=>`<img src="img/${f}.png" loading="lazy" alt="">`).join("");

  const mapsHref = x => "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(x.n + " Bordeaux") + "&query_place_id=" + x.u;
  const webLink = x => x.w ? `<br><a class="enlace" href="${x.w}" target="_blank" rel="noopener">${t.verSitio}</a>` : "";
  document.getElementById("listaHoteles").innerHTML = HOTELES.map(h=>
    `<div class="card"><h3>${h.n}</h3><p>${h.d[lang]}</p><a class="enlace" href="${mapsHref(h)}" target="_blank" rel="noopener">${t.verMapa}</a>${webLink(h)}</div>`).join("");
  document.getElementById("listaBurdeos").innerHTML = BURDEOS.map(b=>
    `<div class="card"><p class="etiqueta">${b.t[lang]}</p><h3>${b.n}</h3><p>${b.d[lang]}</p><a class="enlace" href="${mapsHref(b)}" target="_blank" rel="noopener">${t.verMapa}</a>${webLink(b)}</div>`).join("");

  const bd = document.getElementById("btnDrive");
  bd.href = URL_DRIVE; bd.style.display = URL_DRIVE ? "block" : "none";
  const bf = document.getElementById("btnFotos");
  bf.href = URL_FOTOS; bf.style.display = URL_FOTOS ? "block" : "none";
  document.getElementById("spotify").href = URL_SPOTIFY;
  document.getElementById("spotEmbed").src = "https://open.spotify.com/embed/playlist/" + ID_SPOTIFY;
  document.getElementById("uber").href =
    "https://m.uber.com/ul/?action=setPickup&pickup=my_location&dropoff%5Bformatted_address%5D=" +
    encodeURIComponent("Domaine Sainte-Raphine, Fargues-Saint-Hilaire");

  if(postBoda){
    document.querySelector(".eyebrow").textContent = t.postEyebrow;
    document.querySelector(".fecha").textContent = t.postTxt;
  }
  document.querySelectorAll(".idioma button").forEach(b=> b.setAttribute("aria-pressed", b.dataset.lang===lang));
  pintaCuenta(); pintaMuro(); pintaLista();
}
document.querySelectorAll(".idioma button").forEach(b=>
  b.addEventListener("click", ()=>{ lang = b.dataset.lang; traducir(); }));

function pintaCuenta(){
  const cuenta = document.getElementById("cuenta");
  if(postBoda){ cuenta.innerHTML = ""; return; }
  const falta = new Date(FECHA_BODA) - new Date();
  const d = Math.max(0, Math.floor(falta/86400000));
  const h = Math.max(0, Math.floor(falta/3600000)%24);
  const m = Math.max(0, Math.floor(falta/60000)%60);
  cuenta.innerHTML = [[d,T[lang].dias],[h,T[lang].horas],[m,T[lang].min]]
    .map(([n,l])=>`<div><b>${n}</b><span>${l}</span></div>`).join("");
}

const PAPELES = ["#FBF3D5","#FDE2D0","#F6DCE6","#E4EEDC","#FBE9C8","#E9E2F2"];
function pintaMuro(){
  const publicos = DATOS.deseos.filter(d=>!d.privado);
  const muro = document.getElementById("muro");
  muro.innerHTML = publicos.length
    ? publicos.map((d,i)=>
        '<div class="nota" style="background:'+PAPELES[i%PAPELES.length]+'">' +
        (esMio(d.id) ? '<button class="quitar" data-id="'+d.id+'" title="'+T[lang].borrar+'">✕</button>' : '') +
        '<p>“'+d.texto+'”</p><b>'+d.nombre+'</b></div>').join("")
    : '<p class="vacio">'+T[lang].muroVacio+'</p>';
  muro.querySelectorAll(".quitar").forEach(b=>
    b.addEventListener("click", async ()=>{ await borrar("deseos", b.dataset.id); pintaMuro(); }));
}
document.getElementById("btnDeseo").addEventListener("click", async ()=>{
  const boton = document.getElementById("btnDeseo");
  const nombre = document.getElementById("deNombre").value.trim() || "Anónimo";
  const texto = document.getElementById("deTexto").value.trim();
  if(!texto){ document.getElementById("deTexto").focus(); return; }
  boton.disabled = true;
  const id = await anadir("deseos", {nombre, texto, privado: document.getElementById("dePrivado").checked});
  recuerdaMio(id);
  document.getElementById("deTexto").value = "";
  document.getElementById("dePrivado").checked = false;
  boton.disabled = false;
  pintaMuro();
});

function pintaLista(){
  document.getElementById("listaCanciones").innerHTML = DATOS.canciones.length
    ? DATOS.canciones.map((c,i)=>
        '<div class="cancion"><span>'+String(i+1).padStart(2,"0")+'</span><div><strong>'+c.tema+'</strong> <em>· '+c.artista+'</em></div>' +
        (esMio(c.id) ? '<button class="quitar oscuro" data-id="'+c.id+'" title="'+T[lang].borrar+'">✕</button>' : '') +
        '</div>').join("")
    : '<p>'+T[lang].plVacia+'</p>';
  document.querySelectorAll("#listaCanciones .quitar").forEach(b=>
    b.addEventListener("click", async ()=>{ await borrar("canciones", b.dataset.id); pintaLista(); }));
}
document.getElementById("agregar").addEventListener("click", async ()=>{

  recuerdaMio(id);
  document.getElementById("tema").value = ""; document.getElementById("artista").value = "";
  pintaLista();
});

  let recargando = false;
  navigator.serviceWorker.addEventListener("controllerchange", ()=>{
    if(recargando) return;
    recargando = true; location.reload();
  });
  window.addEventListener("load", async ()=>{
    try{
      const reg = await navigator.serviceWorker.register("sw.js", {updateViaCache:"none"});
      reg.update();
      document.addEventListener("visibilitychange", ()=>{ if(!document.hidden){ reg.update(); refrescar(); } });
      setInterval(()=> reg.update(), 60*60*1000);
    }catch(e){}
  });
}
