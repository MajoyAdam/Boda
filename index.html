<style>
  :root{
    --papel:#F2EEFA; --tinta:#2C2140;
    --cereza:#E8577C; --mandarina:#F2A03D; --menta:#5FC3A4; --uva:#7A68E6;
    --linea:rgba(44,33,64,.14);
    --display:"Fraunces",Georgia,serif;
    --texto:"Outfit","Segoe UI",system-ui,sans-serif;
    --util:"Space Mono",ui-monospace,monospace;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  @media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{animation:none!important;transition:none!important}}
  body{margin:0;background:var(--papel);background-image:radial-gradient(rgba(44,33,64,.05) 1px,transparent 1px);background-size:14px 14px;color:var(--tinta);font-family:var(--texto);font-weight:300;font-size:16px;line-height:1.55}
  .wrap{max-width:560px;margin:0 auto;padding:0 20px 90px}

  .nav{position:sticky;top:0;z-index:20;background:rgba(242,238,250,.93);backdrop-filter:blur(8px);border-bottom:1px solid var(--linea)}
  .nav-top{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:8px;padding:8px 20px 0}
  .idioma{margin-left:auto;display:flex;gap:4px;background:#fff;border:1px solid var(--linea);border-radius:999px;padding:3px}
  .idioma button{border:none;background:none;font-size:17px;line-height:1;padding:5px 8px;border-radius:999px;cursor:pointer;opacity:.4;font-family:var(--util)}
  .idioma button[aria-pressed="true"]{opacity:1;background:var(--papel)}
  .marca{font-family:var(--util);font-size:11px;letter-spacing:.16em;text-transform:uppercase;opacity:.5}
  .nav-inner{max-width:560px;margin:0 auto;display:flex;gap:8px;overflow-x:auto;padding:10px 20px;scrollbar-width:none}
  .nav-inner::-webkit-scrollbar{display:none}
  .nav-inner a{flex:0 0 auto;font-family:var(--util);font-size:11px;letter-spacing:.06em;text-transform:uppercase;text-decoration:none;color:var(--tinta);border:1px solid var(--linea);border-radius:999px;padding:6px 12px;background:#fff}
  .nav-inner a:hover{background:var(--uva);color:#fff;border-color:var(--uva)}
  a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--uva);outline-offset:2px}

  .hero{padding:52px 0 36px;text-align:center}
  .eyebrow{font-family:var(--util);font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--uva);margin:0}
  .names{font-family:var(--display);font-weight:900;font-variation-settings:"SOFT" 100,"WONK" 1;font-size:clamp(52px,17vw,84px);line-height:.92;margin:14px 0 6px}
  .names .amp{display:block;font-size:.42em;color:var(--cereza);font-weight:600;font-style:italic;margin:2px 0}
  .fecha{font-family:var(--util);font-size:13px;letter-spacing:.08em;margin:0}
  .cuenta{display:flex;justify-content:center;gap:10px;margin-top:24px}
  .cuenta div{background:#fff;border:1px solid var(--linea);border-radius:14px;padding:10px 4px;width:68px;box-shadow:3px 3px 0 rgba(122,104,230,.18)}
  .cuenta b{display:block;font-family:var(--display);font-weight:900;font-size:26px;line-height:1}
  .cuenta span{font-family:var(--util);font-size:9px;letter-spacing:.1em;text-transform:uppercase;opacity:.6}
  .acciones{display:flex;gap:8px;margin-top:22px}
  .acciones button{flex:1;font-family:var(--util);font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding:11px 6px;border-radius:12px;border:1px solid var(--tinta);background:#fff;color:var(--tinta);cursor:pointer}
  .acciones button:active{transform:translateY(1px)}

  section{margin-top:44px}
  h2{font-family:var(--display);font-weight:900;font-variation-settings:"SOFT" 100,"WONK" 1;font-size:30px;line-height:1.05;margin:0 0 4px}
  .sub{font-family:var(--util);font-size:11px;letter-spacing:.14em;text-transform:uppercase;opacity:.55;margin:0 0 18px}
  .card{background:#fff;border:1px solid var(--linea);border-radius:18px;padding:18px;margin-bottom:12px;box-shadow:4px 4px 0 rgba(44,33,64,.06)}
  .card h3{margin:0 0 4px;font-family:var(--texto);font-weight:600;font-size:17px}
  .card p{margin:0;font-size:14.5px;opacity:.85}
  .meta{font-family:var(--util);font-size:11px;letter-spacing:.05em;opacity:.55;margin-top:8px}
  .meta a{color:var(--uva)}

  .hora{display:flex;gap:14px;padding:12px 0;border-bottom:1px dashed var(--linea)}
  .hora:last-child{border:none}
  .hora time{font-family:var(--util);font-weight:700;font-size:13px;flex:0 0 52px;color:var(--cereza)}
  .hora strong{display:block;font-weight:600;font-size:15px}
  .hora em{font-style:normal;font-size:13.5px;opacity:.7}

  .paleta{display:flex;gap:8px;margin:14px 0 10px}
  .paleta span{flex:1;height:56px;border-radius:12px;border:1px solid var(--linea)}
  .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
  .tag{font-family:var(--util);font-size:11px;padding:5px 10px;border-radius:999px;border:1px solid var(--linea)}
  .si{background:rgba(95,195,164,.18)} .no{background:rgba(232,87,124,.14)}

  label{display:block;font-family:var(--util);font-size:11px;letter-spacing:.1em;text-transform:uppercase;opacity:.6;margin:14px 0 5px}
  input,select,textarea{width:100%;font-family:var(--texto);font-size:16px;padding:11px 13px;border:1px solid var(--linea);border-radius:12px;background:var(--papel);color:var(--tinta)}
  textarea{min-height:76px;resize:vertical}
  .fila{display:flex;gap:10px}.fila>*{flex:1}
  .opciones{display:flex;gap:8px;margin-top:5px}
  .opciones button{flex:1;font-family:var(--texto);font-size:14px;padding:11px;border-radius:12px;border:1px solid var(--linea);background:var(--papel);color:var(--tinta);cursor:pointer}
  .opciones button[aria-pressed="true"]{background:var(--tinta);color:#fff;border-color:var(--tinta)}
  .enviar{width:100%;margin-top:20px;font-family:var(--display);font-weight:900;font-size:19px;padding:15px;border:none;border-radius:14px;background:var(--cereza);color:#fff;cursor:pointer;box-shadow:4px 4px 0 var(--tinta)}
  .enviar:active{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--tinta)}
  .aviso{font-family:var(--util);font-size:11px;margin-top:12px;opacity:.6;text-align:center}
  .check{display:flex;align-items:center;gap:9px;margin-top:14px;font-size:14px}
  .check input{width:auto}

  .ticket{position:relative;background:#fff;border:1px solid var(--linea);border-radius:18px;padding:20px;box-shadow:4px 4px 0 rgba(232,87,124,.25)}
  .ticket::before,.ticket::after{content:"";position:absolute;width:22px;height:22px;background:var(--papel);border:1px solid var(--linea);border-radius:50%;top:calc(50% - 11px)}
  .ticket::before{left:-12px}.ticket::after{right:-12px}

  .muro{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
  .deseo{flex:1 1 46%;min-width:150px;border-radius:14px;padding:14px;border:1px solid var(--linea);box-shadow:3px 3px 0 rgba(44,33,64,.08);font-size:14px}
  .deseo:nth-child(3n){transform:rotate(-1.4deg)}
  .deseo:nth-child(3n+2){transform:rotate(1.2deg)}
  .deseo p{margin:0 0 8px;font-style:italic}
  .deseo b{font-family:var(--util);font-size:10px;letter-spacing:.1em;text-transform:uppercase;opacity:.6;font-weight:400}

  .cancion{display:flex;gap:10px;align-items:baseline;padding:9px 0;border-bottom:1px dashed var(--linea)}
  .cancion:last-child{border:none}
  .cancion span{font-family:var(--util);font-size:11px;opacity:.45;flex:0 0 24px}
  .cancion strong{font-weight:600;font-size:15px}
  .cancion em{font-style:normal;opacity:.6;font-size:13.5px}
  .portada{width:100%;aspect-ratio:1;border-radius:14px;border:2px dashed var(--linea);display:flex;align-items:center;justify-content:center;font-family:var(--util);font-size:11px;text-align:center;opacity:.5;margin-bottom:14px;padding:20px}

  .rollo{margin:18px -20px;padding:16px 0;background:var(--tinta);border-top:14px solid transparent;border-bottom:14px solid transparent;background-clip:padding-box;position:relative;overflow-x:auto;scrollbar-width:none}
  .rollo::-webkit-scrollbar{display:none}
  .rollo::before,.rollo::after{content:"";position:absolute;left:0;right:0;height:14px;background-image:repeating-linear-gradient(90deg,var(--papel) 0 9px,transparent 9px 20px)}
  .rollo::before{top:-14px}.rollo::after{bottom:-14px}
  .frames{display:flex;gap:8px;padding:0 20px;min-width:min-content}
  .frame{flex:0 0 62px;height:62px;border-radius:6px;border:1px solid rgba(242,238,250,.25);display:flex;align-items:center;justify-content:center;font-family:var(--util);font-size:11px;color:rgba(242,238,250,.5);cursor:pointer}
  .frame.usado{background:var(--mandarina);color:var(--tinta);border-color:var(--mandarina)}
  #qr{display:flex;justify-content:center;margin:16px 0 6px}
  #qr img,#qr canvas{border-radius:12px;border:8px solid #fff;box-shadow:4px 4px 0 rgba(44,33,64,.1)}
  .qr-fallback{font-family:var(--util);font-size:12px;text-align:center;opacity:.6;padding:30px;border:2px dashed var(--linea);border-radius:14px}

  details{background:#fff;border:1px solid var(--linea);border-radius:14px;padding:14px 16px;margin-bottom:8px}
  summary{cursor:pointer;font-weight:600;font-size:15px;list-style:none}
  summary::-webkit-details-marker{display:none}
  summary::after{content:"+";float:right;font-family:var(--util);color:var(--cereza)}
  details[open] summary::after{content:"–"}
  details p{margin:10px 0 0;font-size:14.5px;opacity:.8}

  .panel{background:var(--tinta);color:var(--papel);border-radius:18px;padding:20px;margin-top:44px}
  .panel h2{color:var(--papel);font-size:26px}
  .panel .sub{color:rgba(242,238,250,.6)}
  .panel input{background:rgba(242,238,250,.1);border-color:rgba(242,238,250,.25);color:var(--papel)}
  .panel label{color:rgba(242,238,250,.6)}
  .cifras{display:flex;gap:8px;margin:16px 0}
  .cifras div{flex:1;background:rgba(242,238,250,.08);border-radius:12px;padding:12px 8px;text-align:center}
  .cifras b{display:block;font-family:var(--display);font-weight:900;font-size:24px}
  .cifras span{font-family:var(--util);font-size:9px;letter-spacing:.08em;text-transform:uppercase;opacity:.6}
  .invitado{border-bottom:1px solid rgba(242,238,250,.14);padding:10px 0;font-size:14px}
  .invitado b{font-weight:600}
  .invitado em{font-style:normal;display:block;font-size:12.5px;opacity:.65}
  .privado{font-family:var(--util);font-size:10px;color:var(--mandarina);letter-spacing:.08em;text-transform:uppercase}

  footer{text-align:center;margin-top:48px;font-family:var(--util);font-size:11px;letter-spacing:.08em;opacity:.45}
  footer button{background:none;border:none;font-family:var(--util);font-size:11px;color:var(--tinta);opacity:.6;cursor:pointer;text-decoration:underline;margin-top:8px}
</style>
</head>

let lang = "es";
let postBoda = new Date() > new Date(new Date(FECHA_BODA).getTime() + 36*3600000);

/* ---------- almacenamiento (demo, con respaldo en memoria) ---------- */
const memoria = {};
async function leer(clave){
  try{ const r = await window.storage.get(clave, true); return r ? JSON.parse(r.value) : null; }
  catch(e){ return memoria[clave] ?? null; }
}
async function guardar(clave, valor){
  memoria[clave] = valor;
  try{ await window.storage.set(clave, JSON.stringify(valor), true); }catch(e){}
}

/* ---------- idioma ---------- */
function traducir(){
  const t = T[lang];
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-t]").forEach(el=>{
    const v = t[el.dataset.t];
    if(typeof v === "string") el.textContent = v;
  });
  document.querySelectorAll("[data-ph]").forEach(el=> el.placeholder = t[el.dataset.ph]);
  document.getElementById("urlFotos").textContent = URL_FOTOS.replace(/^https?:\/\//,"");
  document.getElementById("spotify").href = URL_SPOTIFY;

  const ids = ["rsvp","dia","llegar","hoteles","vestuario","deseos","playlist","fotos","faq"];
  document.getElementById("menu").innerHTML = t.menu.map((m,i)=>`<a href="#${ids[i]}">${m}</a>`).join("");
  document.getElementById("bus").innerHTML = t.busOps.map(o=>`<option>${o}</option>`).join("");
  document.getElementById("horario").innerHTML = t.horario.map(([h,tit,txt])=>
    `<div class="hora"><time>${h}</time><div><strong>${tit}</strong><em>${txt}</em></div></div>`).join("");
  document.getElementById("tagsVes").innerHTML = t.tags.map(([c,x])=>`<span class="tag ${c}">${x}</span>`).join("");
  document.getElementById("faqLista").innerHTML = t.faq.map(([p,r])=>
    `<details><summary>${p}</summary><p>${r}</p></details>`).join("");
  document.querySelectorAll(".idioma button").forEach(b=> b.setAttribute("aria-pressed", b.dataset.lang===lang));

  if(postBoda){
    document.querySelector(".eyebrow").textContent = t.postEyebrow;
    document.querySelector(".fecha").textContent = t.postTxt;
  }
  pintaCuenta(); pintaMuro(); pintaLista();
}
document.querySelectorAll(".idioma button").forEach(b=>{
  b.addEventListener("click", ()=>{ lang = b.dataset.lang; traducir(); });
});

/* ---------- cuenta atrás ---------- */
function pintaCuenta(){
  const cuenta = document.getElementById("cuenta");
  if(postBoda){ cuenta.innerHTML = ""; return; }
  const falta = new Date(FECHA_BODA) - new Date();
  const d = Math.max(0, Math.floor(falta/86400000));
  const h = Math.max(0, Math.floor(falta/3600000)%24);
  const m = Math.max(0, Math.floor(falta/60000)%60);
  cuenta.innerHTML = [[d,T[lang].dias],[h,T[lang].horas],[m,T[lang].min]]
    .map(([n,l])=>`<div><b>${n}</b><span>${l}</span></div>`).join("");
}
setInterval(pintaCuenta, 30000);

/* ---------- calendario y whatsapp ---------- */
document.getElementById("btnCal").addEventListener("click", ()=>{
  const f = d => d.toISOString().replace(/[-:]/g,"").split(".")[0]+"Z";
  const ini = new Date(FECHA_BODA), fin = new Date(ini.getTime()+11*3600000);
  const ics = ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//adam-majo//ES","BEGIN:VEVENT",
    "UID:adam-majo-2027@boda","DTSTAMP:"+f(new Date()),"DTSTART:"+f(ini),"DTEND:"+f(fin),
    "SUMMARY:"+T[lang].calTitulo,"LOCATION:Domaine Sainte-Raphine, Fargues-Saint-Hilaire",
    "END:VEVENT","END:VCALENDAR"].join("\r\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([ics],{type:"text/calendar"}));
  a.download = "adam-majo-2027.ics"; a.click();
});
document.getElementById("btnWa").addEventListener("click", ()=>{
  window.open("https://wa.me/"+WHATSAPP+"?text="+encodeURIComponent(lang==="es"?"Hola! Tengo una duda sobre la boda:":"Hi! A question about the wedding:"),"_blank");
});

/* ---------- rsvp ---------- */
let asiste = null;
document.querySelectorAll("#asiste button").forEach(b=>{
  b.addEventListener("click", ()=>{
    asiste = b.dataset.v;
    document.querySelectorAll("#asiste button").forEach(x=>x.setAttribute("aria-pressed", x===b));
  });
});
async function aGoogleForm(d){
  if(!FORM_ID) return;
  const p = new URLSearchParams();
  p.append(CAMPOS.nombre,d.nombre); p.append(CAMPOS.asiste,d.asiste);
  p.append(CAMPOS.acomp,d.acompanantes); p.append(CAMPOS.bus,d.bus);
  p.append(CAMPOS.comida,d.comida); p.append(CAMPOS.nota,d.nota);
  try{ await fetch(`https://docs.google.com/forms/d/e/${FORM_ID}/formResponse?`+p.toString(),{method:"POST",mode:"no-cors"}); }catch(e){}
}
document.getElementById("enviar").addEventListener("click", async ()=>{
  const nombre = document.getElementById("nombre").value.trim();
  if(!nombre){ document.getElementById("nombre").focus(); return; }
  if(!asiste){ document.querySelector("#asiste button").focus(); return; }
  const datos = { nombre, asiste,
    acompanantes: document.getElementById("acomp").value,
    bus: document.getElementById("bus").value,
    comida: document.getElementById("comida").value.trim(),
    nota: document.getElementById("nota").value.trim(),
    enviado: new Date().toISOString() };
  const lista = (await leer("rsvp")) || [];
  lista.push(datos); await guardar("rsvp", lista);
  aGoogleForm(datos);
  document.getElementById("formulario").hidden = true;
  const g = document.getElementById("gracias"); g.hidden = false;
  g.innerHTML = asiste === "si" ? T[lang].graciasSi(nombre.split(" ")[0]) : T[lang].graciasNo;
});

/* ---------- muro de deseos ---------- */
const COLORES = ["rgba(232,87,124,.14)","rgba(242,160,61,.16)","rgba(95,195,164,.16)","rgba(122,104,230,.14)"];
async function pintaMuro(){
  const todos = (await leer("deseos")) || [];
  const publicos = todos.filter(d=>!d.privado);
  const muro = document.getElementById("muro");
  muro.innerHTML = publicos.length
    ? publicos.map((d,i)=>`<div class="deseo" style="background:${COLORES[i%4]}"><p>“${d.texto}”</p><b>${d.nombre}</b></div>`).join("")
    : `<p class="aviso" style="width:100%">${T[lang].muroVacio}</p>`;
}
document.getElementById("btnDeseo").addEventListener("click", async ()=>{
  const nombre = document.getElementById("deNombre").value.trim() || "Anónimo";
  const texto = document.getElementById("deTexto").value.trim();
  if(!texto){ document.getElementById("deTexto").focus(); return; }
  const todos = (await leer("deseos")) || [];
  todos.push({nombre, texto, privado: document.getElementById("dePrivado").checked});
  await guardar("deseos", todos);
  document.getElementById("deTexto").value = "";
  document.getElementById("dePrivado").checked = false;
  pintaMuro();
});

/* ---------- playlist ---------- */
async function pintaLista(){
  const canciones = (await leer("playlist")) || [];
  document.getElementById("listaCanciones").innerHTML = canciones.length
    ? canciones.map((c,i)=>`<div class="cancion"><span>${String(i+1).padStart(2,"0")}</span><div><strong>${c.tema}</strong> <em>· ${c.artista}</em></div></div>`).join("")
    : `<p>${T[lang].plVacia}</p>`;
}
document.getElementById("agregar").addEventListener("click", async ()=>{
  const tema = document.getElementById("tema").value.trim();
  if(!tema){ document.getElementById("tema").focus(); return; }
  const canciones = (await leer("playlist")) || [];
  canciones.push({tema, artista: document.getElementById("artista").value.trim() || "—"});
  await guardar("playlist", canciones);
  document.getElementById("tema").value = ""; document.getElementById("artista").value = "";
  pintaLista();
});

/* ---------- carrete y qr ---------- */
const frames = document.getElementById("frames");
for(let i=1;i<=TOPE_FOTOS;i++){
  const f = document.createElement("div");
  f.className = "frame"; f.textContent = String(i).padStart(2,"0");
  f.addEventListener("click", ()=>f.classList.toggle("usado"));
  frames.appendChild(f);
}
const caja = document.getElementById("qr");
try{ new QRCode(caja,{text:URL_FOTOS,width:148,height:148,colorDark:"#2C2140",colorLight:"#ffffff"}); }
catch(e){ caja.innerHTML = '<div class="qr-fallback">QR · '+URL_FOTOS+'</div>'; }

/* ---------- panel privado ---------- */
document.getElementById("verPanel").addEventListener("click", ()=>{
  const p = document.getElementById("panel");
  p.hidden = false; p.scrollIntoView({behavior:"smooth"});
  document.getElementById("pin").focus();
});
document.getElementById("btnPin").addEventListener("click", async ()=>{
  if(document.getElementById("pin").value !== PIN_NOVIOS){
    document.getElementById("pin").value = "";
    document.getElementById("pin").placeholder = T[lang].pinMal; return;
  }
  document.getElementById("panLogin").hidden = true;
  const caja = document.getElementById("panDatos"); caja.hidden = false;
  const t = T[lang];
  const lista = (await leer("rsvp")) || [];
  const deseos = ((await leer("deseos")) || []).filter(d=>d.privado);
  const vienen = lista.filter(x=>x.asiste==="si").reduce((n,x)=>n+1+Number(x.acompanantes||0),0);
  const nop = lista.filter(x=>x.asiste==="no").length;
  const bus = lista.filter(x=>x.asiste==="si" && x.bus===t.busOps[0]).reduce((n,x)=>n+1+Number(x.acompanantes||0),0);
  caja.innerHTML =
    `<div class="cifras"><div><b>${vienen}</b><span>${t.cifras[0]}</span></div>
     <div><b>${nop}</b><span>${t.cifras[1]}</span></div>
     <div><b>${bus}</b><span>${t.cifras[2]}</span></div></div>` +
    (lista.length ? lista.map(x=>
      `<div class="invitado"><b>${x.nombre}</b> ${x.asiste==="si"?"✓":"✗"} ${Number(x.acompanantes)?"+"+x.acompanantes:""}
       <em>${[x.bus, x.comida, x.nota].filter(Boolean).join(" · ")}</em></div>`).join("")
      : `<p>${t.sinRsvp}</p>`) +
    `<h3 style="font-family:var(--display);font-size:20px;margin:22px 0 6px">${t.panDeseos}</h3>` +
    (deseos.length ? deseos.map(d=>
      `<div class="invitado"><span class="privado">${t.privado}</span><br>“${d.texto}”<em>${d.nombre}</em></div>`).join("")
      : `<p>${t.sinDeseos}</p>`);
});

/* ---------- vista previa modo post-boda ---------- */
document.getElementById("verPost").addEventListener("click", ()=>{
  postBoda = !postBoda;
  ["rsvp","dia","llegar","hoteles","vestuario"].forEach(id=> document.getElementById(id).hidden = postBoda);
  document.querySelector(".acciones").hidden = postBoda;
  if(!postBoda){ document.querySelector(".eyebrow").textContent = T[lang].eyebrow; document.querySelector(".fecha").textContent = T[lang].fechaLugar; }
  traducir();
  window.scrollTo({top:0,behavior:"smooth"});
});

traducir();
if(postBoda){ ["rsvp","dia","llegar","hoteles","vestuario"].forEach(id=> document.getElementById(id).hidden = true); document.querySelector(".acciones").hidden = true; }

/* ---------- funciona sin señal en el campo ---------- */
if("serviceWorker" in navigator){
  window.addEventListener("load", ()=> navigator.serviceWorker.register("sw.js").catch(()=>{}));
}
</script>
</body>
